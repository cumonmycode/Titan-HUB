# Ротация Docker-логов: ни один сервис не должен забить диск VPS json-логами.
# API пишет строку на каждый запрос — без лимита файл растёт безгранично.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: titan-postgres
    restart: unless-stopped
    logging: *default-logging
    # Лимиты памяти: ни один контейнер не может уронить хост (4 ГБ RAM).
    mem_limit: 768m
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: titan_hub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-net

  redis:
    image: redis:7-alpine
    container_name: titan-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # AOF: переживаем краш без потери rate-limit/blacklist состояния.
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-net

  minio:
    image: minio/minio:RELEASE.2023-06-29T05-12-28Z
    container_name: titan-minio
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    healthcheck:
      # mc отсутствует в server-образе → проверяем liveness-эндпоинт через curl
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - titan-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: titan-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/titan_hub
      # Control-plane (реестр клубов, Фаза 1). Отдельная БД на том же сервере.
      # Рантайм app её НЕ использует, пока не построен суперадмин/провижининг —
      # переменная задаётся заранее, чтобы control-инструменты её подхватили.
      CONTROL_DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/titan_control
      # MafBoard (приложение ведущих мафии): своя БД на том же сервере, создаётся при
      # первом старте. Модуль включается, когда в .env заданы MAFBOARD_JWT_SECRET и
      # MAFBOARD_APP_LINK_BASE (см. docs/MAFBOARD.md).
      MAFBOARD_DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/mafboard
      # WebAuthn суперадмина: панель на поддомене admin.titanpos.ru. RP_ID —
      # регистрируемый домен titanpos.ru (валиден для всех *.titanpos.ru),
      # ORIGIN — фактический origin панели. Отделены от клубных WEBAUTHN_*.
      SUPERADMIN_WEBAUTHN_ORIGIN: https://admin.titanpos.ru
      SUPERADMIN_WEBAUTHN_RP_ID: titanpos.ru
      REDIS_URL: redis://redis:6379
      # Хранилище загрузок (MinIO) — соседний контейнер сервиса minio. В .env для
      # локальной разработки стоит localhost: внутри контейнера API это пустой адрес,
      # и любая загрузка картинки падала с ECONNREFUSED (500).
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # Бэкап/восстановление выполняются из API (кнопки в «О системе»).
      BACKUP_DIR: /backups
      RCLONE_CONFIG: /root/.config/rclone/rclone.conf
    volumes:
      # Локальные бэкапы (общие с host-скриптом backup-db.sh) + конфиг rclone (ro).
      - /opt/backups:/backups
      - /root/.config/rclone:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck — чтобы nginx стартовал ТОЛЬКО после прогона миграций (иначе
    # окно 502 при холодном старте/ребуте хоста). node fetch встроен (Node 18+).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - titan-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: titan-web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - titan-net

  wallet:
    build:
      context: .
      dockerfile: apps/wallet/Dockerfile
    container_name: titan-wallet
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/residents').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - titan-net

  # Сайт клуба titanmafia.ru (Next.js). Данные и заявки — API клуба внутри сети
  # (Host клубного поддомена выбирает БД клуба). nginx ходит сюда через resolver,
  # поэтому сайт не блокирует старт nginx.
  site:
    build:
      context: ./apps/site
      dockerfile: Dockerfile
    container_name: titan-site
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    environment:
      SITE_API_URL: http://api:3001
      SITE_CLUB_HOST: kbr.titanpos.ru
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - titan-net

  nginx:
    image: nginx:alpine
    container_name: titan-nginx
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Webroot для certbot (HTTP-01): titanmafia.ru и admin — выпуск и продление без даунтайма.
      - ./nginx/acme:/var/www/certbot:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - nginx-cache:/var/cache/nginx
    # Стартуем nginx только когда апстримы здоровы (api прогнал миграции) —
    # закрывает окно 502 при холодном старте/перезагрузке хоста.
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      wallet:
        condition: service_healthy
    networks:
      - titan-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:

networks:
  titan-net:
    driver: bridge
