# Страницы MafBoard для людей: соглашение, политика, поддержка. Подключает mafboard.com; api.mafboard.com и mafboard.titanpos.ru перенаправляют сюда.

# Пользовательское соглашение (nginx/mafboard/terms.html). Бот ссылается сюда при входе;
# при смене текста поднимите MAFBOARD_TERMS_VERSION — бот попросит принять заново.
location = /terms {
  charset utf-8;
  default_type text/html;
  alias /usr/share/nginx/mafboard/terms.html;
}

# Политика конфиденциальности (nginx/mafboard/privacy.html) — Privacy Policy URL
# для экрана согласия Google OAuth и приложения Twitch в MafBoard Studio.
location = /privacy {
  charset utf-8;
  default_type text/html;
  alias /usr/share/nginx/mafboard/privacy.html;
}

# Страница поддержки (nginx/mafboard/support.html) — Support URL в App Store Connect.
location = /support {
  charset utf-8;
  default_type text/html;
  alias /usr/share/nginx/mafboard/support.html;
}

