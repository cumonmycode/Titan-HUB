# Только для api.mafboard.com: короткие адреса без префикса /api/mafboard.

# То же на api.mafboard.com по короткому адресу /v1/studio/relay.
location = /v1/studio/relay {
  limit_req zone=api burst=20 nodelay;
  proxy_pass http://api:3001/api/mafboard/v1/studio/relay;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Фото игрока из приложения (PUT /v1/clubs/<клуб>/players/<игрок>/photo): до 8 МБ, общий предел сервера — 1 МБ.
# Регулярка главнее префиксного /v1/ ниже; путь переписывается без переменных — resolver не нужен.
location ~ ^/v1/clubs/[0-9a-fA-F-]+/players/[0-9a-fA-F-]+/photo$ {
  client_max_body_size 9m;
  limit_req zone=api burst=20 nodelay;
  rewrite ^/v1/(.*)$ /api/mafboard/v1/$1 break;
  proxy_pass http://api:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# Короткие адреса API: https://api.mafboard.com/v1/... — это /api/mafboard/v1/... на сервере.
location /v1/ {
  limit_req zone=api burst=50 nodelay;
  proxy_pass http://api:3001/api/mafboard/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

