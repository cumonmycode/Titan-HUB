# Только для api.mafboard.com: короткие адреса без префикса /api/mafboard.

# То же на api.mafboard.com по короткому адресу /v1/studio/relay.
location = /v1/studio/relay {
  limit_req zone=api burst=20 nodelay;
  proxy_pass http://api:3001/api/mafboard/v1/studio/relay;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Короткие адреса API: https://api.mafboard.com/v1/... — это /api/mafboard/v1/... на сервере.
location /v1/ {
  limit_req zone=api burst=50 nodelay;
  proxy_pass http://api:3001/api/mafboard/v1/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

