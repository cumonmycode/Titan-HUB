# Служебные маршруты MafBoard: API, релей пульта, Universal Links и страницы ссылок из бота и QR.
# Подключают api.mafboard.com и mafboard.titanpos.ru (nginx/nginx.conf). Папка nginx/mafboard уже смонтирована в nginx.

# Облачный канал пульта MafBoard Studio: WebSocket живёт часами, токен приходит первым сообщением.
location = /api/mafboard/v1/studio/relay {
  limit_req zone=api burst=20 nodelay;
  proxy_pass http://api:3001;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Фото игрока из приложения (PUT …/clubs/<клуб>/players/<игрок>/photo): до 8 МБ, общий предел сервера — 1 МБ.
location ~ ^/api/mafboard/v1/clubs/[0-9a-fA-F-]+/players/[0-9a-fA-F-]+/photo$ {
  client_max_body_size 9m;
  limit_req zone=api burst=20 nodelay;
  proxy_pass http://api:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location /api/mafboard/ {
  limit_req zone=api burst=50 nodelay;
  proxy_pass http://api:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# Лента обновлений MafBoard Studio (Sparkle): appcast.xml и архивы. Файлы кладутся на сервер в
# /opt/titan-hub/nginx/mafboard/updates (в git не входят, scripts/make-update.sh в репозитории MafBoardStudio).
location /studio/updates/ {
  alias /usr/share/nginx/mafboard/updates/;
  autoindex off;
  types { application/xml xml; application/zip zip; text/html html; }
  add_header Cache-Control "no-cache" always;
}

# Universal Links: Telegram открывает https-ссылку возврата сразу в приложении
# (bundle ru.titan.mafboard, команда G99YH9UK8C — как у ru.titan.hub).
location = /.well-known/apple-app-site-association {
  default_type application/json;
  return 200 '{"applinks":{"details":[{"appIDs":["G99YH9UK8C.ru.titan.mafboard"],"components":[{"/":"/auth/return*"},{"/":"/studio/login*"},{"/":"/club/join*"}]}]}}';
}

# QR-код входа в MafBoard Studio. Если камера не открыла приложение сразу: кнопка на mafboard://.
# Ключ сопряжения идёт после # и на сервер не попадает, ссылку собирает скрипт на телефоне.
location = /studio/login {
  default_type "text/html; charset=utf-8";
  return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MafBoard Studio</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;background:#0b0b0f;color:#f5f5f7}a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:14px;background:#f5f5f7;color:#0b0b0f;font-weight:600;text-decoration:none}</style></head><body><main><h1>Вход в MafBoard Studio</h1><p>Откройте этот QR-код на iPhone, где установлен MafBoard и выполнен вход.</p><a id="open" href="mafboard://studio/login">Открыть MafBoard</a></main><script>document.getElementById("open").href="mafboard://studio/login"+location.search+location.hash</script></body></html>';
}

# Приглашение судьи в клуб MafBoard (Universal Link). Если приложение не открылось само: кнопка на mafboard://.
location = /club/join {
  default_type "text/html; charset=utf-8";
  add_header Referrer-Policy "no-referrer" always;
  return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MafBoard</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;background:#0b0b0f;color:#f5f5f7}a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:14px;background:#f5f5f7;color:#0b0b0f;font-weight:600;text-decoration:none}</style></head><body><main><h1>Приглашение в клуб</h1><p>Вас пригласили судьёй клуба в MafBoard. Откройте ссылку на iPhone, где установлен MafBoard.</p><a id="open" href="mafboard://club/join">Открыть MafBoard</a></main><script>document.getElementById("open").href="mafboard://club/join"+location.hash</script></body></html>';
}

# Ссылка возврата из бота, если приложение не открылось само: кнопка на mafboard://.
location = /auth/return {
  default_type "text/html; charset=utf-8";
  return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MafBoard</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;background:#0b0b0f;color:#f5f5f7}a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:14px;background:#f5f5f7;color:#0b0b0f;font-weight:600;text-decoration:none}</style></head><body><main><h1>Вход подтверждён</h1><p>Вернитесь в приложение MafBoard.</p><a id="open" href="mafboard://auth/return">Открыть MafBoard</a></main><script>document.getElementById("open").href="mafboard://auth/return"+location.search</script></body></html>';
}

