user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name titanpos.ru www.titanpos.ru;
    return 301 https://$host$request_uri;
  }

  # Main HTTPS server
  server {
    listen 443 ssl http2;
    server_name titanpos.ru www.titanpos.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10m;

    # API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
    }

    # Восстановление БД из загруженного файла (.sql.gz): API принимает до 200 МБ
    # (RESTORE_UPLOAD_MAX_BYTES в system.router.ts), общий лимит сервера 10m отбивал
    # бы такой файл 413 ещё на nginx. Только основной домен — на клуб-поддоменах
    # маршрут всё равно отвечает 403. Таймаут длиннее: страховочный бэкап + restore.
    location = /api/system/restore-upload {
      client_max_body_size 200m;
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 900s;
    }

    # СММ: снятые рилс, фото клуба и скриншоты статистики — до 60 МБ (MAX_MEDIA_BYTES в
    # lib/imageStore.ts). Regex-локейшен важнее префикса /api/, остальной API — прежние 10m.
    location ~ ^/api/smm/(posts/[0-9a-f-]+/media|assets|analytics/screenshot)$ {
      client_max_body_size 64m;
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # Auth rate limiting
    location /api/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (system update streaming)
    location /api/system/update {
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
    }

    # MinIO media. ВАЖНО: используем resolver + переменную upstream, чтобы nginx
    # резолвил minio в РАНТАЙМЕ, а не один раз при старте. Иначе отсутствующий/
    # упавший контейнер minio ронял запуск/reload всего nginx (полный 502 — см.
    # инцидент 2026-05-30). Теперь падение minio даёт 502 только на /media/.
    # ^~ обязателен: иначе regex-локейшен статики (~* \.(…|jpg|png…)$ ниже) перехватывал
    # /media/<файл>.jpg и отдавал 404 веба — загруженные фото и картинки ТВ не показывались.
    location ^~ /media/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $minio_upstream minio:9000;
      rewrite ^/media/(.*)$ /titan-hub/$1 break;
      proxy_pass http://$minio_upstream;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # My Titan (PWA клиентов). Приложение собрано с basePath/assetPrefix
    # '/residents', поэтому его статика приходит как /residents/_next/static/*.js.
    #
    # ВАЖНО про приоритет location в nginx: regex-локейшены (~*) побеждают
    # обычные префиксные. Без модификатора "location /residents" проигрывал бы
    # общему "location ~* \.(js|css|...)$" ниже, и чанки уходили бы на web:3000
    # (чужая сборка) → пустая PWA. Модификатор "^~" делает префикс /residents/
    # приоритетнее любого regex, поэтому вся статика (в т.ч. /residents/_next/...)
    # гарантированно идёт на upstream wallet:3002.
    #
    # URI проксируется БЕЗ изменения (нет слеша в proxy_pass), так что префикс
    # /residents сохраняется — именно его ждёт приложение из-за basePath.
    location ^~ /residents/ {
      proxy_pass http://wallet:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      # Хэшированные чанки (/residents/_next/static/*) кэшируем вечно.
      location ^~ /residents/_next/static/ {
        proxy_pass http://wallet:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }
    }

    # Голый /residents (без слеша) — точка входа приложения.
    location = /residents {
      proxy_pass http://wallet:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Обратная совместимость: старый путь /wallet → /residents (уже установленные
    # PWA/ссылки). Приложение больше не отдаётся под /wallet (сменился basePath).
    location = /wallet { return 301 https://$host/residents; }
    location ^~ /wallet/ { return 301 https://$host/residents/; }

    # Next.js static assets основного веб-приложения — кэшируем вечно
    # (имена файлов содержат хэш). Статика Resident сюда НЕ попадает: её
    # перехватывает приоритетный "^~ /residents/" выше.
    location /_next/static/ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js chunks и прочие ресурсы основного веб-приложения.
    # (Чанки кошелька перехвачены "^~ /wallet/" выше и сюда не доходят.)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=86400";
    }

    # Суперадмин-панель ПЕРЕЕХАЛА на admin.titanpos.ru — старый путь редиректим
    # туда (панель живёт только на admin-поддомене). /api/superadmin/ на основном
    # домене не редиректим (Bearer-API, не используется фронтом admin-панели).
    location /superadmin {
      return 301 https://admin.titanpos.ru$request_uri;
    }

    # Main web app — HTML никогда не кэшируем в браузере
    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      # Убираем Cache-Control от Next.js и задаём свой — no-cache для HTML
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
  }

  # ──────────────────────────────────────────────────────────────────────────
  # admin.titanpos.ru — суперадмин-панель платформы.
  #
  # Изолированный контур: на поддомене admin доступна ТОЛЬКО панель /superadmin
  # и её API /api/superadmin/ + Next.js-ассеты. Клубное приложение (POS,
  # /dashboard, клубные /api/*, кошелёк, /media) сюда НЕ проксируется — любой
  # посторонний путь редиректится на /superadmin.
  #
  # Cert ОТДЕЛЬНЫЙ от основного домена (admin-fullchain.pem/admin-privkey.pem);
  # их кладёт оператор в /etc/nginx/ssl/ отдельно.
  # ──────────────────────────────────────────────────────────────────────────

  # admin: HTTP → HTTPS redirect (+ ACME challenge webroot для renew)
  server {
    listen 80;
    server_name admin.titanpos.ru;

    # Webroot для certbot (renew без даунтайма). Каталог монтируется отдельно;
    # отсутствие файла → 404, это нормально.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # admin: HTTPS — только суперадмин-панель
  server {
    listen 443 ssl http2;
    server_name admin.titanpos.ru;

    # ОТДЕЛЬНЫЙ cert для admin — НЕ основной fullchain.pem.
    ssl_certificate /etc/nginx/ssl/admin-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/admin-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10m;

    # Корень поддомена ведёт прямо на панель.
    location = / {
      return 301 https://$host/superadmin;
    }

    # API суперадмина → api:3001 (как основной /api/, со всеми заголовками).
    location /api/superadmin/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
    }

    # Страница панели → web:3000. "^~" даёт префиксу /superadmin/ приоритет над
    # regex-локейшеном статики ниже, чтобы вложенные пути панели шли на web.
    location ^~ /superadmin/ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    # Голый /superadmin (без слеша) — точка входа панели.
    location = /superadmin {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    # Next.js static assets панели — кэшируем вечно (хэш в имени файла).
    location ^~ /_next/static/ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Прочие Next.js-ресурсы панели (RSC payload, _next/data и т.п.).
    location ^~ /_next/ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Статика по расширению (js/css/шрифты/иконки) — чтобы ассеты панели грузились.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=86400";
    }

    # ВСЕ остальные пути на admin (клубные /api/*, /pos, /dashboard и т.п.)
    # НЕ отдают клубное приложение — редирект на панель.
    location / {
      return 301 https://$host/superadmin;
    }
  }

  # ──────────────────────────────────────────────────────────────────────────
  # mafboard.titanpos.ru — сервер приложения MafBoard для ведущих мафии
  # (docs/MAFBOARD.md). Точное имя выше wildcard клубов: mafboard — НЕ клуб
  # (RESERVED_LABELS в clubResolver). Наружу — только API MafBoard, страница
  # возврата из бота и файл Universal Links. HTTP→HTTPS и ACME — общий блок *.titanpos.ru.
  # ──────────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name mafboard.titanpos.ru;

    ssl_certificate /etc/nginx/ssl/wildcard-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;

    location /api/mafboard/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Universal Links: Telegram открывает https-ссылку возврата сразу в приложении
    # (bundle ru.titan.mafboard, команда G99YH9UK8C — как у ru.titan.hub).
    location = /.well-known/apple-app-site-association {
      default_type application/json;
      return 200 '{"applinks":{"details":[{"appIDs":["G99YH9UK8C.ru.titan.mafboard"],"components":[{"/":"/auth/return*"}]}]}}';
    }

    # Ссылка возврата из бота, если приложение не открылось само: кнопка на mafboard://.
    location = /auth/return {
      default_type "text/html; charset=utf-8";
      return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MafBoard</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;background:#0b0b0f;color:#f5f5f7}a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:14px;background:#f5f5f7;color:#0b0b0f;font-weight:600;text-decoration:none}</style></head><body><main><h1>Вход подтверждён</h1><p>Вернитесь в приложение MafBoard.</p><a id="open" href="mafboard://auth/return">Открыть MafBoard</a></main><script>document.getElementById("open").href="mafboard://auth/return"+location.search</script></body></html>';
    }

    # Пользовательское соглашение (nginx/mafboard/terms.html). Бот ссылается сюда при входе;
    # при смене текста поднимите MAFBOARD_TERMS_VERSION — бот попросит принять заново.
    location = /terms {
      charset utf-8;
      default_type text/html;
      alias /usr/share/nginx/mafboard/terms.html;
    }

    # Страница поддержки (nginx/mafboard/support.html) — Support URL в App Store Connect.
    location = /support {
      charset utf-8;
      default_type text/html;
      alias /usr/share/nginx/mafboard/support.html;
    }

    location / {
      return 404;
    }
  }

  # ──────────────────────────────────────────────────────────────────────────
  # *.titanpos.ru — КЛУБ-ПОДДОМЕНЫ арендаторов (database-per-club).
  #
  # Каждый клуб получает свой поддомен (напр. kbr.titanpos.ru) и видит ПОЛНОЕ
  # клубное приложение (POS, /dashboard, клубные /api/*, /media). Резолюция
  # клуба идёт по поддомену в tenantContext на стороне api — поэтому КРИТИЧНО
  # пробрасывать `proxy_set_header Host $host;` во все proxy_pass на api.
  #
  # ПРИОРИТЕТ server_name: точные имена (titanpos.ru, admin.titanpos.ru) выше
  # wildcard, поэтому они продолжают матчиться своими блоками; всё остальное
  # *.titanpos.ru попадает сюда.
  #
  # Cert — ОТДЕЛЬНЫЙ wildcard (wildcard-fullchain.pem/wildcard-privkey.pem),
  # его кладёт оператор в /etc/nginx/ssl/.
  # ──────────────────────────────────────────────────────────────────────────

  # клуб-поддомены: HTTP → HTTPS redirect (+ ACME challenge webroot для renew)
  server {
    listen 80;
    server_name *.titanpos.ru;

    # Webroot для certbot (renew wildcard-сертификата без даунтайма).
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # клуб-поддомены: HTTPS — полноценное клубное приложение
  server {
    listen 443 ssl http2;
    server_name *.titanpos.ru;

    # ОТДЕЛЬНЫЙ wildcard-cert для *.titanpos.ru.
    ssl_certificate /etc/nginx/ssl/wildcard-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10m;

    # API. КРИТИЧНО: proxy_set_header Host $host; — по нему tenantContext
    # резолвит клуб по поддомену. Без него все поддомены ушли бы в один клуб.
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
    }

    # СММ: снятые рилс, фото клуба и скриншоты статистики — до 60 МБ (MAX_MEDIA_BYTES в
    # lib/imageStore.ts). Regex-локейшен важнее префикса /api/, остальной API — прежние 10m.
    location ~ ^/api/smm/(posts/[0-9a-f-]+/media|assets|analytics/screenshot)$ {
      client_max_body_size 64m;
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # Auth rate limiting
    location /api/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (system update streaming)
    location /api/system/update {
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
    }

    # MinIO media (runtime-resolver, чтобы падение minio не ронило nginx — см.
    # основной блок titanpos.ru). ^~ — чтобы regex статики не перехватывал картинки.
    location ^~ /media/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $minio_upstream minio:9000;
      rewrite ^/media/(.*)$ /titan-hub/$1 break;
      proxy_pass http://$minio_upstream;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # My Titan (PWA клиентов клуба) — /residents на ПОДДОМЕНЕ клуба.
    # Один общий контейнер wallet:3002 обслуживает все клубы: HTML статичен, а
    # клиентские запросы к API относительные → бьют в /api ЭТОГО поддомена, и
    # tenantContext резолвит нужный клуб по Host. "^~" даёт приоритет над regex-
    # статикой ниже, иначе чанки /residents/_next/* ушли бы на web:3000 → пустая PWA.
    location ^~ /residents/ {
      proxy_pass http://wallet:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      location ^~ /residents/_next/static/ {
        proxy_pass http://wallet:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }
    }
    location = /residents {
      proxy_pass http://wallet:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets основного веб-приложения — кэшируем вечно (хэш в имени).
    location /_next/static/ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Статика по расширению (js/css/шрифты/иконки).
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=86400";
    }

    # Main web app — HTML никогда не кэшируем в браузере.
    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      # Убираем Cache-Control от Next.js и задаём свой — no-cache для HTML
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
  }

  # ──────────────────────────────────────────────────────────────────────────
  # Сайт клуба на собственном домене (titanmafia.ru). Конфиг генерирует агент
  # scripts/site/domain-agent.sh по домену из HUB («Сайт → Домен»): сертификат
  # Let's Encrypt, основной адрес и перенаправления. Пустой каталог — сайта нет.
  # ──────────────────────────────────────────────────────────────────────────
  include /etc/nginx/sites/*.conf;

  # Зеркало сайта на поддомене HUB (точное имя важнее *.titanpos.ru).
  server {
    listen 443 ssl http2;
    server_name site.titanpos.ru;
    ssl_certificate /etc/nginx/ssl/wildcard-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_upstream site:3000;

    # Витрина и заявки сайта — API клуба TITAN KBR (Host выбирает БД клуба).
    location /api/site/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api:3001;
      proxy_set_header Host kbr.titanpos.ru;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Остальной API клуба с домена сайта не открываем.
    location /api/ { return 404; }

    location ^~ /_next/static/ {
      proxy_pass http://$site_upstream;
      proxy_set_header Host $host;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /media/ {
      proxy_pass http://$site_upstream;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }
    location ^~ /docs/ {
      proxy_pass http://$site_upstream;
      proxy_set_header Host $host;
      expires 7d;
    }
    location / {
      proxy_pass http://$site_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
