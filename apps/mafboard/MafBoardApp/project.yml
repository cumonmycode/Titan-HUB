# iOS-приложение MafBoard. Проект Xcode генерируется: `cd apps/mafboard/MafBoardApp && xcodegen`.
# Ядро и клиент API — локальный Swift-пакет ../MafBoardCore.
name: MafBoard
options:
  bundleIdPrefix: ru.titan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: G99YH9UK8C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MafBoardCore:
    path: ../MafBoardCore
targets:
  MafBoard:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: MafBoardCore
        product: MafBoardCore
      - package: MafBoardCore
        product: MafBoardClient
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MafBoard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: ru.titan.mafboard
            CFBundleURLSchemes: [mafboard]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Generated/MafBoard.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:mafboard.titanpos.ru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.titan.mafboard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
