<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .n { position: absolute; inset: 0; border-radius: 48px; background: rgba(18, 12, 30, .9); border: 4px solid #8b5cf6;
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif; animation: pop 200ms ease-out; }
  .n b { font-size: 46vmin; line-height: 1; font-weight: 700; }
  .n span { font-size: 6vmin; color: #c4b5fd; margin-top: 2vmin; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
</style>
</head>
<body>
  <div class="n"><b id="n"></b><span id="tv"></span></div>
  <script>
    var q = new URLSearchParams(location.search)
    document.getElementById('n').textContent = q.get('n') || '?'
    document.getElementById('tv').textContent = q.get('tv') === '1' ? 'здесь идёт показ' : 'монитор'
  </script>
</body>
</html>
