<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15121b">
<title>My Titan</title>
<!--
  Кнопка «Открыть приложение» из бота My Titan ведёт сюда: Telegram разрешает в
  кнопках только https-ссылки, поэтому страница переправляет в само приложение
  (схема titanresident://). Вход уже подтверждён — приложение получает его само,
  ссылка ничего секретного не несёт.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #15121b; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    max-width: 420px; margin: 0 auto; padding: 32px 20px calc(32px + env(safe-area-inset-bottom)); }
  .kicker { color: #a78bfa; font-size: 12px; font-weight: 900; letter-spacing: 3px; }
  .check { width: 64px; height: 64px; border-radius: 32px; margin-bottom: 24px;
    background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.35);
    display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 28px; line-height: 34px; font-weight: 800; margin: 8px 0 10px; }
  p { color: #94a3b8; font-size: 15px; line-height: 21px; margin: 0; }
  .open { display: flex; align-items: center; justify-content: center; min-height: 54px; margin-top: 28px;
    border-radius: 14px; color: #fff; font-size: 16px; font-weight: 800; text-decoration: none;
    background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); box-shadow: 0 10px 28px rgba(109, 40, 217, 0.35); }
  .open:active { transform: scale(0.98); }
  .store { display: none; margin-top: 18px; text-align: center; color: #a78bfa; font-size: 14px;
    font-weight: 600; text-decoration: none; }
  .ios .store { display: block; }
</style>
</head>
<body>
<main>
  <div class="check" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <div class="kicker">MY TITAN</div>
  <h1>Готово!</h1>
  <p>Вход подтверждён. Откройте приложение — оно войдёт само. Если не открылось, просто вернитесь в него.</p>
  <a id="open" class="open" href="titanresident://open">Открыть My Titan</a>
  <a class="store" href="https://apps.apple.com/app/id6816426909">Нет приложения? Скачать в App Store</a>
</main>
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var android = /Android/i.test(ua);
    if (/iPhone|iPad|iPod/i.test(ua)) document.documentElement.className = 'ios';
    // Android: intent:// открывает приложение по пакету (Chrome не переходит по чужим схемам сам).
    var target = android
      ? 'intent://open#Intent;scheme=titanresident;package=ru.titan.resident;end'
      : 'titanresident://open';
    document.getElementById('open').href = target;
    setTimeout(function () { window.location.href = target; }, 250);
  })();
</script>
</body>
</html>
