packages:
  - "apps/*"
  - "packages/*"
  # Нативные приложения (Expo) ставятся своим npm и не входят в pnpm-воркспейс:
  # серверные Docker-сборки не должны тянуть React Native.
  - "!apps/mobile"
  - "!apps/client"
  - "!apps/home"
  # Сайт клуба (titanmafia.ru) — отдельный npm-проект со своим Dockerfile.
  - "!apps/site"
  # Titan Screen для Windows (Electron) — свой npm, в серверные сборки не входит.
  - "!apps/screen-pc"
  # Рекламные сцены экранов — генератор со своим npm, собирается локально.
  - "!apps/screen-ads"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
