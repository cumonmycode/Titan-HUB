packages:
  - "apps/*"
  - "packages/*"
  # Нативные приложения (Expo) ставятся своим npm и не входят в pnpm-воркспейс:
  # серверные Docker-сборки не должны тянуть React Native.
  - "!apps/mobile"
  - "!apps/client"
  - "!apps/home"
  # Сайт клуба (titanmafia.ru) — отдельный npm-проект со своим Dockerfile.
  - "!apps/site"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
